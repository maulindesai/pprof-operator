{{- if .Values.rbac.enable }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: pprof-sidecar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pprof-sidecar-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pprof-sidecar-rolebinding
subjects:
  - kind: ServiceAccount
    name: pprof-sidecar
    namespace: default
roleRef:
  kind: Role
  name: pprof-sidecar-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-proxy-reader
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pprof-sidecar-kubelet-reader-binding
subjects:
  - kind: ServiceAccount
    name: pprof-sidecar
    namespace: default
roleRef:
  kind: ClusterRole
  name: node-proxy-reader
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
