---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: profilers.observability.pprof-operator.dev
spec:
  group: observability.pprof-operator.dev
  names:
    kind: Profiler
    listKind: ProfilerList
    plural: profilers
    singular: profiler
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Profiler is the Schema for the profilers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Profiler
            properties:
              awsCredentialsSecret:
                description: AWS credentials secret name
                type: string
              cpuThreshold:
                description: CPU threshold in percentage (0-100) that triggers profiling
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              memoryThreshold:
                description: Memory threshold in percentage (0-100) that triggers
                  profiling
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              monitoringPeriod:
                default: 15
                description: Monitoring period in seconds to check resource usage
                format: int32
                type: integer
              profileDuration:
                default: 30
                description: Duration in seconds to collect the profile
                format: int32
                type: integer
              s3Bucket:
                description: S3 bucket to upload profiles to
                type: string
              s3PathPrefix:
                description: S3 path prefix for storing profiles
                type: string
              s3Region:
                default: us-east-1
                description: S3 region
                type: string
              scrapURL:
                description: ScrapTarget is the URL to scrape profiles from
                properties:
                  auth:
                    description: Auth Scrap Endpoint authentication detail
                    properties:
                      basicAuth:
                        description: BasicAuth contains credentials for basic authentication
                        properties:
                          password:
                            description: Password for basic authentication
                            type: string
                          secretRef:
                            description: SecretRef references a secret that contains
                              the credentials
                            properties:
                              name:
                                description: Name of the secret
                                type: string
                              namespace:
                                description: Namespace of the secret
                                type: string
                              passwordKey:
                                default: password
                                description: PasswordKey is the key in the secret
                                  that contains the password
                                type: string
                              usernameKey:
                                default: username
                                description: UsernameKey is the key in the secret
                                  that contains the username
                                type: string
                            required:
                            - name
                            type: object
                          username:
                            description: Username for basic authentication
                            type: string
                        type: object
                      type:
                        default: Basic
                        description: Type of authentication to use
                        enum:
                        - Basic
                        - None
                        type: string
                    required:
                    - type
                    type: object
                  scrapeURL:
                    description: ScrapURL Scrap Endpoint
                    type: string
                type: object
            required:
            - s3Bucket
            type: object
          status:
            description: status defines the observed state of Profiler
            properties:
              profiles:
                description: List of profiles that have been collected
                items:
                  description: ProfileRecord contains information about a collected
                    profile
                  properties:
                    reason:
                      description: Reason why the profile was triggered
                      type: string
                    s3URL:
                      description: S3 URL where the profile is stored
                      type: string
                    timestamp:
                      description: Timestamp when the profile was collected
                      format: date-time
                      type: string
                    type:
                      description: Type of profile (cpu, memory, etc.)
                      type: string
                  required:
                  - reason
                  - s3URL
                  - timestamp
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
