# This rule is not used by the project pprof-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over observability.pprof-operator.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pprof-operator
    app.kubernetes.io/managed-by: kustomize
  name: profiler-admin-role
rules:
- apiGroups:
  - observability.pprof-operator.dev
  resources:
  - profilers
  verbs:
  - '*'
- apiGroups:
  - observability.pprof-operator.dev
  resources:
  - profilers/status
  verbs:
  - get
